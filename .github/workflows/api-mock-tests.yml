name: Real API Tests - Mock Server

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which real API suite should run?'
        required: true
        default: 'all'
        type: choice
        options: [all, acceptance, smoke, regression]

env:
  CYPRESS_INSTALL_BINARY: 0

permissions:
  contents: read

jobs:
  api-tests:
    name: Real API suites against local mock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck automation and generator
        run: npm run typecheck

      - name: Run selected real API suites and record every result
        env:
          SELECTED_SUITE: ${{ github.event.inputs.suite || 'all' }}
        run: |
          mkdir -p reports/allure-results
          overall=0

          for suite in acceptance smoke regression; do
            if [ "$SELECTED_SUITE" != "all" ] && [ "$SELECTED_SUITE" != "$suite" ]; then
              continue
            fi

            node mock-server/server.js > "reports/mock-${suite}.log" 2>&1 &
            server_pid=$!
            ready=0

            for attempt in $(seq 1 15); do
              if curl --fail --silent http://localhost:3001/health > /dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              echo "Mock server was not ready after 15 seconds for ${suite}."
              cat "reports/mock-${suite}.log"
              suite_exit=1
            else
              set +e
              API_URL=http://localhost:3001 npx --no-install cucumber-js \
                --profile "api-${suite}" \
                --format summary \
                --format "json:reports/api-${suite}.json" \
                --format-options "{\"resultsDir\":\"reports/allure-results/${suite}\"}"
              suite_exit=$?
              set -e
            fi

            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "${suite}=${suite_exit}" | tee -a reports/api-suite-status.txt

            if [ "$suite_exit" -ne 0 ]; then
              overall=1
            fi
          done

          exit "$overall"

      - name: Generate Allure HTML report
        id: allure
        if: always()
        run: npx --no-install allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ github.run_number }}
          path: |
            reports/api-*.json
            reports/api-suite-status.txt
            reports/mock-*.log
            reports/allure-results/
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always() && steps.allure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: reports/allure-report/
          if-no-files-found: error

  deploy-pages:
    name: Publish latest Allure report to Pages
    needs: api-tests
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download generated report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: reports/allure-report

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
