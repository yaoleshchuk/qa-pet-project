name: Strict Dry-run - Manual

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which dry-run profile should be validated?'
        required: true
        default: 'acceptance'
        type: choice
        options: [default, acceptance, smoke, regression]

permissions:
  contents: read

jobs:
  dry-run:
    name: Strict dry-run - ${{ github.event.inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Validate included step matching without browser execution
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: node scripts/validate-cucumber-profile.js "$PROFILE" "reports/dry-run-${PROFILE}.json"
      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: reports/dry-run-${{ github.event.inputs.profile }}.json
          if-no-files-found: error
