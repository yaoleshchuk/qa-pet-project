name: Strict Dry-run - Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Strict dry-run - ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, acceptance, smoke, regression]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Validate included step matching without browser execution
        env:
          PROFILE: ${{ matrix.profile }}
        run: node scripts/validate-cucumber-profile.js "$PROFILE" "reports/dry-run-${PROFILE}.json"
      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dry-run-${{ matrix.profile }}-${{ github.run_number }}
          path: reports/dry-run-${{ matrix.profile }}.json
          if-no-files-found: error
